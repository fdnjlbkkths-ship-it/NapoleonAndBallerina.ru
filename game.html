<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Sweet Rush — сладкий бонус с эклерами, Анной Павловой и тортиками. Без ставок, только красивые цифры.">
  <meta name="theme-color" content="#2a1814">
  <title>Sweet Rush — бонус Sweet Master</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,550;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="game" id="app">
    <header class="game__top">
      <div class="brand">
        <div class="brand__name">Sweet Rush</div>
        <p class="brand__tag">Бонус ×1000 · без ставок, только десерт</p>
      </div>
      <span class="pill" title="Режим без азарта">🍰 demo</span>
    </header>

    <section class="stats" aria-label="Счётчики">
      <div class="stat">
        <span class="stat__label">Фриспины</span>
        <span class="stat__value" id="stat-spins">10</span>
      </div>
      <div class="stat">
        <span class="stat__label">Спин</span>
        <span class="stat__value" id="stat-win">0</span>
      </div>
      <div class="stat">
        <span class="stat__label">Всего</span>
        <span class="stat__value stat__value--gold" id="stat-total">0</span>
      </div>
    </section>

    <section class="board-wrap" aria-label="Игровое поле">
      <div class="board" id="board" role="grid" aria-rowcount="7" aria-colcount="7"></div>
      <div class="fx-layer" id="fx-layer" aria-hidden="true"></div>
    </section>

    <p class="hint" id="status">Кластеры из 5+ одинаковых фигурок · каскады · липкие множители</p>

    <div class="legend" id="legend" aria-label="Фигурки"></div>

    <div class="controls">
      <button type="button" class="btn btn--primary" id="btn-play">Запустить бонус</button>
      <button type="button" class="btn btn--ghost" id="btn-auto">Автобонус</button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div class="overlay__card">
      <h2 id="overlay-title">Бонус готов</h2>
      <p>Красивые сладкие очки за этот заход — без ставок и вывода.</p>
      <div class="overlay__points" id="overlay-points">0</div>
      <button type="button" class="btn btn--primary" id="overlay-close">Закрыть</button>
    </div>
  </div>

  <script type="module" src="/src/game/game.js"></script>
</body>
</html>
